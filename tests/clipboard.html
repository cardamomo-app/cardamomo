<!doctype html>
<meta charset="utf-8">
<title>Cardamomo clipboard regression checks</title>
<h1>Clipboard regression checks</h1>
<p>Open this page through the local development server.</p>
<pre id="results"></pre>
<button id="selection-paste">Test selection replacement</button>
<div id="editing-fixture"></div>
<pre id="selection-result"></pre>
<script src="../dist/assets/purify.min.js"></script>
<script src="../dist/assets/marked.umd.js"></script>
<script type="module">
import { clipboardMarkdown, pasteMarkdown } from '../dist/clipboard-v1.mjs';
import { createMarkdownEditor, readMarkdownEditor } from '../dist/native-editor-v1.mjs';
const output = document.querySelector('#results');
let failed = 0, passed = 0;
function check(name, fn) {
  try { fn();passed++;output.textContent += `PASS ${name}\n`; }
  catch (error) { failed++;output.textContent += `FAIL ${name}: ${error.message}\n`; }
}
function assert(value, message) { if (!value) throw Error(message); }
function convert(html, plain = '') {
  return clipboardMarkdown({ getData: type => type === 'text/html' ? html : plain });
}
function rendered(markdown) {
  const body = new DOMParser().parseFromString(marked.parse(markdown), 'text/html').body;
  return body;
}
check('source fonts, colors, and backgrounds are discarded; semantic formatting survives', () => {
  const md = convert('<div style="font-family:Papyrus;color:red;background:yellow"><p><b>Bold</b> and <i>italic</i></p><ul><li>One</li><li>Two</li></ul></div>');
  const view = rendered(md), editor = createMarkdownEditor(md);
  assert(view.querySelector('strong')?.textContent === 'Bold', md);
  assert(view.querySelector('em')?.textContent === 'italic', md);
  assert(view.querySelectorAll('ul > li').length === 2, md);
  assert(!editor.querySelector('[style],[color],[face],font,b,strong,i,em,ul,li'), editor.innerHTML);
  assert(readMarkdownEditor(editor) === md, 'Markdown changed at the editor boundary');
});
check('inline styles from document editors become bold and italic Markdown', () => {
  const md = convert('<b style="font-weight:normal"><span style="font-weight:700;font-style:italic;color:#ff0000">Both</span><span> normal</span></b>');
  const view = rendered(md);
  assert(view.querySelector('strong em,em strong')?.textContent === 'Both', md);
  assert(view.textContent.trim() === 'Both normal', md);
});
check('nested inline styles do not duplicate emphasis delimiters', () => {
  const md = convert('<div style="font-weight:700"><span style="font-weight:700">Bold</span></div>');
  assert(md === '**Bold**', md);
});
check('headings, nested ordered lists, links, quotes, and strike survive', () => {
  const md = convert('<h2>Title</h2><ol start="3"><li>Three<ul><li>Nested</li></ul></li><li>Four</li></ol><p><a href="https://example.com/a(b)">Link</a> <s>Old</s></p><blockquote><p>Quote</p></blockquote>');
  const view = rendered(md);
  assert(view.querySelector('h2')?.textContent === 'Title', md);
  assert(view.querySelector('ol')?.getAttribute('start') === '3', md);
  assert(view.querySelector('ol li ul li')?.textContent === 'Nested', md);
  assert(view.querySelector('a')?.getAttribute('href') === 'https://example.com/a(b)', md);
  assert(view.querySelector('del')?.textContent === 'Old', md);
  assert(view.querySelector('blockquote')?.textContent.includes('Quote'), md);
});
check('code preserves whitespace and Markdown punctuation', () => {
  const md = convert('<pre><code>const a = "**literal**";\n  next();</code></pre><p><code>x * y</code></p>');
  const view = rendered(md);
  assert(view.querySelector('pre code')?.textContent.includes('  next();'), md);
  assert(view.querySelector('p code')?.textContent === 'x * y', md);
  assert(readMarkdownEditor(createMarkdownEditor(md)) === md, 'Code changed on insertion');
});
check('paragraphs and line breaks remain distinct', () => {
  const md = convert('<p><b>One</b><br>Line</p><p>Two</p>');
  const view = rendered(md);
  assert(view.querySelectorAll('p').length === 2 && view.querySelectorAll('br').length === 1, md);
});
check('plain Markdown and incidental rich wrappers keep original syntax', () => {
  const plain = '# Heading\r\n\r\n**bold** and *italic*\r\n- item';
  const expected = plain.replace(/\r\n/g, '\n');
  assert(convert('', plain) === expected, 'Plain Markdown changed');
  assert(convert('<div style="color:red">**bold** and *italic*</div>', '**bold** and *italic*') === '**bold** and *italic*', 'Incidental HTML escaped Markdown');
});
check('scripts, embeds, remote backgrounds, and unsafe links cannot enter the editor', () => {
  const md = convert('<style>body{color:red}</style><script>alert(1)<\/script><iframe src="https://example.com"></iframe><p style="background:url(https://example.com/pixel)"><b>Safe</b> <a href="javascript:alert(1)" onclick="alert(2)">Link</a></p>');
  assert(md.includes('**Safe**') && md.includes('Link'), md);
  assert(!/alert|javascript|iframe|style|background|pixel/.test(md), md);
  assert(!createMarkdownEditor(md).querySelector('[style],script,iframe,a'), 'Source markup leaked');
});
output.textContent += `\n${passed} passed; ${failed} failed\n`;
document.title = failed ? 'FAIL: clipboard checks' : 'PASS: clipboard checks';
document.querySelector('#selection-paste').addEventListener('click', () => {
  const editor = createMarkdownEditor('Before target after');
  document.querySelector('#editing-fixture').replaceChildren(editor);
  editor.focus();
  const range = document.createRange(), text = editor.querySelector('p').firstChild;
  range.setStart(text, 7);range.setEnd(text, 13);
  const selection = document.getSelection();
  selection.removeAllRanges();selection.addRange(range);
  let prevented = false;
  const success = pasteMarkdown(editor, {
    clipboardData: { getData: type => type === 'text/html'
      ? '<span style="font-weight:700;font-style:italic;font-family:Georgia;color:red;background:yellow">replacement</span>' : 'replacement' },
    preventDefault() { prevented = true; }
  });
  const actual = readMarkdownEditor(editor);
  const correct = success && prevented && actual === 'Before ***replacement*** after' && selection.isCollapsed;
  document.querySelector('#selection-result').textContent = `${correct ? 'PASS' : 'FAIL'} selected text replacement and caret: ${actual}`;
});
</script>
